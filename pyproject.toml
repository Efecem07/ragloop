[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragloop"
version = "0.2.0"
description = "Hybrid retrieval (BM25 + dense, fused by reciprocal rank) with a retrieval evaluation harness. No dependencies beyond an embeddings client."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Efe Cem Bardakoglu", email = "bardakogluefecem@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["rag", "retrieval", "bm25", "hybrid-search", "evals", "llm", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Efecem07/ragloop"

[tool.hatch.build.targets.wheel]
packages = ["ragloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
